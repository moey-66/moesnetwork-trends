# Hourly: remind the owner about a newsletter still waiting for approval; skip it after the cut-off.
# Rules (quiet hours, cut-off) are in newsletter/review.py.
name: Newsletter reminders

on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: newsletter-review
  cancel-in-progress: false

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Anything waiting?
        id: check
        run: |
          if grep -lq '"status": "pending"' newsletter/issues/*/approval.json newsletter/practice/*/approval.json 2>/dev/null; then echo "pending=yes" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-python@v5
        if: steps.check.outputs.pending == 'yes'
        with:
          python-version: "3.12"
      - name: Send reminders / expire
        if: steps.check.outputs.pending == 'yes'
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_SENDER_EMAIL: ${{ vars.BREVO_SENDER_EMAIL }}
          BREVO_SENDER_NAME: ${{ vars.BREVO_SENDER_NAME }}
          NEWSLETTER_REVIEWER_EMAIL: ${{ vars.NEWSLETTER_REVIEWER_EMAIL }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 newsletter/review.py remind
      - name: Commit
        if: steps.check.outputs.pending == 'yes'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add newsletter
          git diff --staged --quiet || git commit -m "Newsletter reminder state"
          git pull --rebase --quiet || true
          git push
