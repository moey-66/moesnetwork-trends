# FREE alternative to the Cloudflare Worker: GitHub runs local_scan.py every hour and commits trends.json.
# Use only in a PUBLIC repository (standard runners are free there, and the page can read the raw file).
name: Hourly trend scan

on:
  schedule:
    - cron: "17 * * * *"   # every hour at :17 (off the top of the hour, when GitHub is busiest). The trends page shows "Last updated".
  workflow_dispatch:        # adds a "Run workflow" button for manual runs

concurrency:               # never run two scans at once (a slow run is skipped, not doubled)
  group: trend-scan
  cancel-in-progress: false

permissions:
  contents: write           # needed to commit trends.json and history/ back to the repo

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan feeds
        run: python3 local_scan.py --retag --out trends.json
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add trends.json .local_state/items.json
          if [ -d history ]; then git add history/; fi
          git diff --staged --quiet || git commit -m "Trend scan $(date -u +"%F %H:%M") UTC"
          git pull --rebase --quiet || true   # in case the weekly newsletter job pushed first
          git push
