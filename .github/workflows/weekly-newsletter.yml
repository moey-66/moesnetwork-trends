# Weekly newsletter, with an approval step.
# Sunday 18:00 SAST: build the week's top-5 brief, create it in Brevo as a DRAFT, open an approval issue
# and email the preview. Nothing reaches subscribers until the owner comments "approve" on that issue
# (see newsletter-decision.yml). Hourly reminders: newsletter-reminders.yml. Details: newsletter/review.py.
name: Weekly newsletter

on:
  schedule:
    - cron: "0 16 * * 0"     # Sundays 16:00 UTC = 18:00 SAST (GitHub can start scheduled jobs a bit late)
  workflow_dispatch:
    inputs:
      week_of:
        description: "Any date in the Mon-Fri week to cover (YYYY-MM-DD). Empty = the week just finished."
        required: false
        default: ""
      practice:
        description: "Practice run: emails + approval issue only, never touches subscribers or the website"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: newsletter-review
  cancel-in-progress: false

jobs:
  newsletter:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
      BREVO_LIST_ID: ${{ vars.BREVO_LIST_ID }}
      BREVO_SENDER_EMAIL: ${{ vars.BREVO_SENDER_EMAIL }}
      BREVO_SENDER_NAME: ${{ vars.BREVO_SENDER_NAME }}
      NEWSLETTER_REVIEWER_EMAIL: ${{ vars.NEWSLETTER_REVIEWER_EMAIL }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # full history, so old versions of trends.json can fill missing days

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the issue (archive pages are held back until approval)
        id: build
        env:
          WEEK_OF: ${{ inputs.week_of }}
          PRACTICE: ${{ inputs.practice && 'yes' || '' }}
          NEWSLETTER_EXCLUDE_TOPICS: ${{ vars.NEWSLETTER_EXCLUDE_TOPICS == 'none' && ' ' || vars.NEWSLETTER_EXCLUDE_TOPICS || 'recalls' }}
        run: |
          if [ -n "$WEEK_OF" ] && ! echo "$WEEK_OF" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then echo "week_of must look like 2026-11-02"; exit 1; fi
          OUT=newsletter/issues; [ -n "$PRACTICE" ] && OUT=newsletter/practice
          PENDING="$RUNNER_TEMP/archive"; mkdir -p "$PENDING"; cp -R newsletter/archive/. "$PENDING"/ 2>/dev/null || true
          ARGS="--out $OUT --archive $PENDING"; [ -n "$WEEK_OF" ] && ARGS="$ARGS --week-of $WEEK_OF"
          python3 newsletter/weekly_digest.py $ARGS
          DIR=$(grep '^issue_dir=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2-)
          mkdir -p "$DIR/archive" && cp -R "$PENDING"/. "$DIR/archive"/
          echo "practice=$PRACTICE" >> "$GITHUB_OUTPUT"

      - name: Create the DRAFT in Brevo (real runs only)
        if: steps.build.outputs.practice != 'yes'
        env:
          NEWSLETTER_SEND_MODE: draft
        run: python3 newsletter/brevo_send.py "${{ steps.build.outputs.issue_dir }}"

      - name: Open the approval issue and email the preview
        run: python3 newsletter/review.py start "${{ steps.build.outputs.issue_dir }}" ${{ steps.build.outputs.practice == 'yes' && '--practice' || '' }}

      - name: Commit
        if: always() && steps.build.outputs.slug != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add newsletter/issues newsletter/practice 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Newsletter ${{ steps.build.outputs.slug }}: waiting for approval"
          git pull --rebase --quiet || true
          git push
